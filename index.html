<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAXIMUS">
<meta name="theme-color" content="#00c8ff">
<title>MAXIMUS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --cyan:#00d4ff; --turq:#00e5c0; --emerald:#22c55e; --lime:#a3e635;
  --sun:#ffe14d; --orange:#ff9f1c; --deep:#0077b6; --ink:#053b56;
  --glass:rgba(255,255,255,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#9af0ff 0%,#4ddcff 20%,#22c9e8 42%,#2ad4b0 64%,#7fe04a 84%,#c8f06a 100%);
  background-attachment:fixed;
  user-select:none;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:-120px;right:-100px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,#fffbe0 0%,#ffe680 30%,rgba(255,220,90,.4) 55%,transparent 72%);
  filter:blur(6px);animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.bubble{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.25) 40%,rgba(120,220,255,.15) 70%,rgba(0,150,200,.05));
  box-shadow:inset -8px -10px 18px rgba(0,120,170,.15),inset 8px 10px 18px rgba(255,255,255,.7),0 6px 20px rgba(0,120,170,.15);
  animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-30px) translateX(15px)}100%{transform:translateY(0) translateX(0)}}

#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
  max-width:1200px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{font-size:22px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff,#bff4ff 60%,#3ac6ea);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 6px rgba(0,120,170,.25);filter:drop-shadow(0 1px 0 #fff)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--ink);opacity:.7;letter-spacing:2px;background:none;-webkit-text-fill-color:var(--ink)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px 100px;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(255,255,255,.55),rgba(255,255,255,.15));
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.8)}
nav button{flex:1;max-width:120px;border:0;background:transparent;font-size:11px;font-weight:700;color:var(--ink);opacity:.65;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;cursor:pointer}
nav button .ico{font-size:20px}
nav button.active{opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(180,240,255,.6));
  box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,150,200,.25)}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.28));
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,.75);border-radius:24px;
  box-shadow:0 10px 28px rgba(0,90,130,.18),inset 0 1px 0 rgba(255,255,255,.95);padding:16px;margin-bottom:14px}
h2{margin:6px 0 12px;font-size:20px;font-weight:800;color:var(--ink)}
h3{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--ink);opacity:.85}
.muted{opacity:.7;font-size:13px}

.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.orb{position:relative;width:132px;height:132px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 34% 28%,#f2ffff 0%,#7fe8ff 32%,#00b4ee 68%,#0071a8 100%);
  box-shadow:0 14px 34px rgba(0,140,190,.45),inset 0 -14px 26px rgba(0,60,100,.3),inset 0 12px 26px rgba(255,255,255,.65);
  display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.orb::after{content:"";position:absolute;top:10%;left:16%;width:40%;height:28%;
  background:radial-gradient(ellipse,rgba(255,255,255,.95),transparent 70%);border-radius:50%;filter:blur(2px)}
.orb .lvl{font-size:44px;font-weight:900;line-height:1;text-shadow:0 3px 8px rgba(0,80,120,.5)}
.orb .lab{font-size:10px;font-weight:700;letter-spacing:2px;opacity:.9}
.hero-info{flex:1;min-width:180px}
.league{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(180deg,#fff,#ffe680);color:#7a4d00;border:1px solid #fff;box-shadow:0 3px 10px rgba(180,120,0,.25);margin-bottom:6px}
.xpbar{height:22px;border-radius:999px;background:rgba(0,80,120,.18);overflow:hidden;position:relative;
  box-shadow:inset 0 2px 6px rgba(0,50,80,.3);border:1px solid rgba(255,255,255,.6)}
.xpfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7bffb0,#00e0c0 50%,#00b4ee);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 14px rgba(0,220,200,.7);transition:width .6s cubic-bezier(.2,.9,.3,1.2);position:relative}
.xpfill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 55%);border-radius:999px}
.xptext{font-size:12px;font-weight:700;margin-top:5px;opacity:.85}

.streak{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;
  background:linear-gradient(180deg,#ffe680,#ff9f1c);color:#7a3a00;border:1px solid #fff;box-shadow:0 4px 12px rgba(255,150,20,.4)}

.quest{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;margin-bottom:10px;
  background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
  border:1px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,90,130,.14),inset 0 1px 0 #fff}
.quest.done{opacity:.55}
.quest .cat{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  box-shadow:inset 0 2px 6px rgba(255,255,255,.7),0 4px 10px rgba(0,80,120,.2)}
.quest .body{flex:1;min-width:0}
.quest .title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest .meta{font-size:11px;opacity:.75;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.quest .xpbadge{font-weight:800;color:#00875a;font-size:13px;white-space:nowrap}
.qbtn{border:0;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;
  background:linear-gradient(180deg,#eaffff,#7fe8ff 55%,#00b4ee);color:#024;
  box-shadow:0 4px 12px rgba(0,150,200,.4),inset 0 1px 0 #fff;transition:transform .15s}
.qbtn:active{transform:scale(.92)}
.qbtn.ghost{background:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 #fff}

button.primary{border:0;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#8affd6,#00e0c0 45%,#00a8d8);
  box-shadow:0 6px 18px rgba(0,180,220,.45),inset 0 1px 0 rgba(255,255,255,.8);text-shadow:0 1px 2px rgba(0,80,120,.4)}
button.primary:active{transform:translateY(1px)}
button.ghost{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5);padding:10px 16px;border-radius:999px;font-weight:700;color:var(--ink);cursor:pointer;font-size:14px}
button.danger{border:0;background:linear-gradient(180deg,#ffb3b3,#ff5a5a);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;font-size:14px}

input,select,textarea{font-family:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.7);color:var(--ink);width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:#00b4ee;box-shadow:0 0 0 3px rgba(0,180,238,.25)}
label{font-size:12px;font-weight:800;letter-spacing:.5px;opacity:.8;display:block;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.pill-group{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.45);
  font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.sel{background:linear-gradient(180deg,#eaffff,#7fe8ff 55%,#00b4ee);color:#024;box-shadow:0 4px 12px rgba(0,150,200,.35),inset 0 1px 0 #fff}

.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.switch input{width:auto;transform:scale(1.3);accent-color:#00b4ee}
.slider{width:100%;accent-color:#00b4ee;padding:0}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ach{padding:12px;border-radius:18px;text-align:center;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7)}
.ach.locked{opacity:.35;filter:grayscale(1)}
.ach .aic{font-size:28px}
.ach .an{font-size:11px;font-weight:800;margin-top:4px}
.ach .ad{font-size:10px;opacity:.7;margin-top:2px}

.attr{margin-bottom:12px}
.attr .top{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px}
.attrbar{height:14px;border-radius:999px;background:rgba(0,80,120,.15);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,50,80,.25)}
.attrfill{height:100%;border-radius:999px;background:linear-gradient(90deg,#a3e635,#22c55e);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);transition:width .5s}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(30px);z-index:20;opacity:0;pointer-events:none;
  transition:all .35s cubic-bezier(.2,.9,.3,1.2);padding:14px 22px;border-radius:999px;font-weight:800;font-size:15px;color:#024;
  background:linear-gradient(180deg,#eaffff,#7fe8ff 55%,#00b4ee);box-shadow:0 10px 30px rgba(0,150,200,.5),inset 0 1px 0 #fff;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,40,60,.4);backdrop-filter:blur(4px)}
#modal.open{display:flex}
#modal .sheet{width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(220,245,255,.95));box-shadow:0 -10px 40px rgba(0,80,120,.3);animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}

.fab{position:fixed;right:22px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:8;width:60px;height:60px;border-radius:50%;border:0;font-size:30px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#a3e635,#22c55e 55%,#0e8f3e);box-shadow:0 10px 24px rgba(20,160,60,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.fab:active{transform:scale(.94)}

.note{font-size:12px;line-height:1.5;padding:12px 14px;border-radius:16px;background:rgba(255,240,180,.7);border:1px solid #ffdf80;margin-bottom:12px}
</style>
</head>
<body>
<div id="sky"><div class="sun"></div></div>
<div id="app">
  <header>
    <div class="brand">MAXIMUS<small>LEVEL UP YOUR REAL LIFE</small></div>
    <div id="streakpill"></div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="home" class="active"><span class="ico">🌤️</span>Home</button>
    <button data-tab="quests"><span class="ico">📜</span>Quests</button>
    <button data-tab="stats"><span class="ico">📊</span>Stats</button>
    <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>
</div>
<button class="fab" id="fab" title="New quest">+</button>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const LS_KEY = 'maximus.v1';

const LEAGUES = [
  {name:'Bronze',   min:1,  c1:'#ffd7a8', c2:'#c47b2a'},
  {name:'Silver',   min:5,  c1:'#f4f7fb', c2:'#9fb0c3'},
  {name:'Gold',     min:10, c1:'#ffe680', c2:'#d99b00'},
  {name:'Platinum', min:16, c1:'#d6fff4', c2:'#2fb8a0'},
  {name:'Diamond',  min:24, c1:'#d8f4ff', c2:'#3aa8e0'},
  {name:'Master',   min:34, c1:'#e6d8ff', c2:'#7a5ae0'},
  {name:'Legend',   min:48, c1:'#ffd8ec', c2:'#e0459a'},
];

const ACHIEVEMENTS = [
  {id:'first',  n:'First Light',     d:'Complete your first quest',   i:'🌅', f:s=>s.stats.totalCompleted>=1},
  {id:'ten',    n:'Getting Warm',    d:'Complete 10 quests',          i:'🔥', f:s=>s.stats.totalCompleted>=10},
  {id:'fifty',  n:'Momentum',        d:'Complete 50 quests',          i:'🚀', f:s=>s.stats.totalCompleted>=50},
  {id:'hundred',n:'Centurion',       d:'Complete 100 quests',         i:'🏛️', f:s=>s.stats.totalCompleted>=100},
  {id:'lv5',    n:'Apprentice',      d:'Reach level 5',               i:'⭐', f:s=>level(s.player.totalXp)>=5},
  {id:'lv10',   n:'Adept',           d:'Reach level 10',              i:'🌟', f:s=>level(s.player.totalXp)>=10},
  {id:'lv20',   n:'Champion',        d:'Reach level 20',              i:'💫', f:s=>level(s.player.totalXp)>=20},
  {id:'lv50',   n:'Ascendant',       d:'Reach level 50',              i:'👑', f:s=>level(s.player.totalXp)>=50},
  {id:'streak3',n:'On a Roll',       d:'3-day streak',                i:'📆', f:s=>s.player.streak>=3},
  {id:'streak7',n:'Week Warrior',    d:'7-day streak',                i:'🗓️', f:s=>s.player.streak>=7},
  {id:'streak30',n:'Unbroken',       d:'30-day streak',               i:'💎', f:s=>s.player.streak>=30},
  {id:'perfect',n:'Perfect Day',     d:'Complete every quest in a day',i:'✅', f:s=>s._perfectDay===true},
];

const DEFAULT_DIALOGUES = {
  mentor: [
    "Small steps become legends. {q} is waiting — you know what to do.",
    "The strongest version of you is built one action at a time. Start with {q}.",
    "You don't need motivation. You need momentum. {q} is one rep away.",
    "Your future self just sent a thank-you note. It starts with {q}.",
    "Discipline is self-respect in motion. Honour it with {q}.",
  ],
  sarcastic: [
    "Oh look, {q} isn't going to do itself. Shocking, I know.",
    "The couch will survive without you. {q}. Now.",
    "Congratulations, you've unlocked '{q}'. Also known as 'responsibility'.",
    "Your phone battery is at stake. {q} — go, before it dies.",
    "I'd remind you of {q}, but I assumed you'd forget anyway.",
  ],
  ruthless: [
    "{q}. No excuses. No negotiating. Move.",
    "Comfort is a liar. {q}. Now.",
    "You promised. Deliver. {q}.",
    "Every minute you hesitate, someone hungrier is working. {q}.",
    "Silence the noise. Execute {q}. That is all.",
  ]
};

function freshState(){
  const cat = [
    {id:uid(), name:'Fitness',  color:'#ff9f1c', icon:'💪'},
    {id:uid(), name:'Learning', color:'#00d4ff', icon:'📚'},
    {id:uid(), name:'Work',     color:'#22c55e', icon:'💼'},
    {id:uid(), name:'Wellness', color:'#a3e635', icon:'🌿'},
    {id:uid(), name:'Home',     color:'#ffe14d', icon:'🏠'},
  ];
  const attrs = [
    {id:uid(), name:'Body',   icon:'💪', xp:0},
    {id:uid(), name:'Mind',   icon:'🧠', xp:0},
    {id:uid(), name:'Spirit', icon:'✨', xp:0},
    {id:uid(), name:'Craft',  icon:'🛠️', xp:0},
    {id:uid(), name:'Social', icon:'🤝', xp:0},
  ];
  const today = todayStr();
  return {
    version:1,
    player:{ totalXp:0, streak:0, lastComplete:null, achievements:[] },
    quests:[
      {id:uid(), title:'Morning stretch',   catId:cat[0].id, attrId:attrs[0].id, xp:15, priority:'med', schedule:'daily', completions:[], reminder:'07:30', note:''},
      {id:uid(), title:'Read 10 pages',     catId:cat[1].id, attrId:attrs[1].id, xp:20, priority:'med', schedule:'daily', completions:[], reminder:'', note:''},
      {id:uid(), title:'Deep work block',   catId:cat[2].id, attrId:attrs[3].id, xp:40, priority:'high', schedule:'weekdays', completions:[], reminder:'09:00', note:'90 minutes, no phone'},
      {id:uid(), title:'Evening walk',      catId:cat[3].id, attrId:attrs[0].id, xp:25, priority:'low', schedule:'daily', completions:[], reminder:'', note:''},
    ],
    categories:cat,
    attributes:attrs,
    settings:{
      personality:'mentor',
      music:true, musicVol:0.35, track:'aero',
      sfx:true, sfxVol:0.6,
    },
    dialogues: JSON.parse(JSON.stringify(DEFAULT_DIALOGUES)),
    stats:{ totalCompleted:0, dailyHistory:{} },
    createdAt: today,
  };
}

function uid(){ return (crypto.randomUUID?crypto.randomUUID():'id'+Math.random().toString(36).slice(2)+Date.now().toString(36)); }
function todayStr(){ const d=new Date(); return dateStr(d); }
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function level(totalXp){ let L=1; while(50*(L+1)*L <= totalXp) L++; return L; }
function xpForLevel(L){ return 50*L*(L-1); }
function xpIntoLevel(tx){ const L=level(tx); return tx - xpForLevel(L); }
function xpForNext(L){ return 100*L; }
function leagueFor(L){ let idx=0; for(let i=0;i<LEAGUES.length;i++) if(L>=LEAGUES[i].min) idx=i; return idx; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return [...(root||document).querySelectorAll(sel)]; }

let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(!s.dialogues) s.dialogues = JSON.parse(JSON.stringify(DEFAULT_DIALOGUES));
      if(!s.stats) s.stats = {totalCompleted:0,dailyHistory:{}};
      if(!s.settings.personality) s.settings.personality='mentor';
      return s;
    }
  }catch(e){ console.warn('load failed',e); }
  return freshState();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ console.warn('save failed',e); } }

const Music = {
  ctx:null, master:null, playing:false, track:'aero', timer:null, step:0, nextTime:0,
  tracks:{
    aero:{ name:'Aero Dawn', bpm:72, root:261.63,
      chords:[[0,4,7,11],[7,11,14,17],[5,9,12,16],[2,5,9,12]],
      arp:[0,4,7,11,14,7,4,0] },
    lagoon:{ name:'Lagoon Drift', bpm:64, root:220,
      chords:[[0,3,7,10],[5,8,12,15],[3,7,10,14],[8,12,15,19]],
      arp:[0,3,7,10,14,10,7,3] },
    canopy:{ name:'Sunlit Canopy', bpm:84, root:293.66,
      chords:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]],
      arp:[0,4,7,11,16,11,7,4] },
  },
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = S.settings.musicVol;
    this.master.connect(this.ctx.destination);
  },
  start(){
    if(!S.settings.music) return;
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.playing = true;
    this.step = 0;
    this.nextTime = this.ctx.currentTime + 0.1;
    clearInterval(this.timer);
    this.timer = setInterval(()=>this.tick(), 100);
  },
  stop(){ this.playing = false; clearInterval(this.timer); },
  setVolume(v){ if(this.master) this.master.gain.value = v; },
  tick(){
    if(!this.playing || !this.ctx) return;
    const t = this.tracks[this.track];
    const beat = 60/t.bpm;
    const stepDur = beat/2;
    while(this.nextTime < this.ctx.currentTime + 0.4){
      const s = this.step;
      if(s % 8 === 0){
        const chord = t.chords[Math.floor(s/8) % t.chords.length];
